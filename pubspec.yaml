name: abrkit
description: A pure Dart codec for legacy and modern Adobe Photoshop ABR brush libraries.
version: 0.1.3
homepage: https://github.com/focale-editor/abrkit
repository: https://github.com/focale-editor/abrkit

topics:
  - photoshop
  - brush
  - image-processing
  - codec
  - file-format

screenshots:
  - description: 'A flat illustration of ABR brush-library decoding and encoding.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  pscore: '>=0.1.3 <0.2.0'

dev_dependencies:
  checks: ^0.3.2
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 AbrKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
