name: abrkit
description: A pure Dart reader for legacy and modern Adobe Photoshop ABR brush libraries.
version: 0.1.0
homepage: https://github.com/focale-editor/abrkit
repository: https://github.com/focale-editor/abrkit

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  pscore: '>=0.1.0 <0.2.0'

dev_dependencies:
  analyzer: ^14.1.0
  checks: ^0.3.1
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.31.2

release:
  changelog:
    header: '# 📰 AbrKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
